- name: Upgrade system safely
  ansible.builtin.dnf:
    name: "*"
    state: latest
    update_only: yes

- name: Disable swap immediately
  ansible.builtin.command: swapoff -a
  changed_when: false

- name: Disable swap permanently in /etc/fstab
  ansible.builtin.replace:
    path: /etc/fstab
    regexp: '^([^#].*\s+swap\s+.*)$'
    replace: '# \1'


- name: Ensure required kernel modules config file
  copy:
    dest: /etc/modules-load.d/k8s.conf
    content: |
      overlay
      br_netfilter
    owner: root
    group: root
    mode: '0644'


- name: Load overlay module
  community.general.modprobe:
    name: overlay
    state: present

- name: Load br_netfilter module
  community.general.modprobe:
    name: br_netfilter
    state: present


- name: Add Docker CE repository
  ansible.builtin.get_url:
    url: https://download.docker.com/linux/centos/docker-ce.repo
    dest: /etc/yum.repos.d/docker-ce.repo
    mode: '0644'

- name: Set SELinux to permissive
  ansible.posix.selinux:
    policy: targeted
    state: permissive

# - name: Use sed to replace a string
#   ansible.builtin.shell: "sed -i 's/^SELINUX=enforcing$/SELINUX=permissive/' /etc/selinux/config"

- name: Add the Kubernetes yum repository.
  ansible.builtin.yum_repository:
    name: Kubernetes
    description: Kubernetes
    file: /etc/yum.repos.d/kubernetes.repo
    baseurl: https://pkgs.k8s.io/core:/stable:/v1.35/rpm/
    gpgcheck: true
    gpgkey: https://pkgs.k8s.io/core:/stable:/v1.35/rpm/repodata/repomd.xml.key
    enabled: true
    exclude: kubelet kubeadm kubectl cri-tools kubernetes-cni


- name: Install kubelet, kubeadm , kubectl and containerd
  ansible.builtin.dnf:
    name: 
      - kubelet 
      - kubeadm 
      - kubectl 
    state: present
    disable_excludes: Kubernetes

- name: Use iptables-legacy backend if available
  ansible.builtin.shell: |
    alternatives --set iptables /usr/sbin/iptables-legacy || true
    alternatives --set ip6tables /usr/sbin/ip6tables-legacy || true
    alternatives --set arptables /usr/sbin/arptables-legacy || true
    alternatives --set ebtables /usr/sbin/ebtables-legacy || true
  changed_when: false

- name: Install Packages
  ansible.builtin.dnf:
    name: 
      - containerd.io
      - containernetworking-plugins
      - tcptraceroute 
      - nc
      - tcpdump
    state: present

- name: Copy all CNI binaries to /opt/cni/bin
  shell: cp /usr/libexec/cni/* /opt/cni/bin/
  become: true

- name: Enable the kubelet service before running kubeadm
  ansible.builtin.systemd_service:
    state: started
    name: kubelet
    enabled: true


- name: Enable the containerd service before running kubeadm
  ansible.builtin.systemd_service:
    name: containerd
    enabled: true
    state: started


- name: Create containerd config directory
  ansible.builtin.file:
    path: /etc/containerd
    state: directory
    mode: '0755'



# ------- Kube network


- name: Enable IPv4 packet forwarding
  ansible.posix.sysctl:
    name: net.ipv4.ip_forward
    value: '1'
    sysctl_file: /etc/sysctl.d/k8s.conf
    state: present
    reload: true

- name: Disable IPv6
  ansible.posix.sysctl:
    name: net.ipv6.conf.all.disable_ipv6
    value: '1'
    state: present
    reload: false

- name: Disable IPv6 default
  ansible.posix.sysctl:
    name: net.ipv6.conf.default.disable_ipv6
    value: '1'
    state: present
    reload: true

- name: Enable bridge traffic through iptables
  ansible.posix.sysctl:
    name: net.bridge.bridge-nf-call-iptables
    value: '1'
    sysctl_file: /etc/sysctl.d/99-k8s.conf
    state: present
    reload: true

- name: Enable bridge IPv6 traffic through iptables
  ansible.posix.sysctl:
    name: net.bridge.bridge-nf-call-ip6tables
    value: '1'
    sysctl_file: /etc/sysctl.d/99-k8s.conf
    state: present
    reload: true

- name: Generate default containerd config
  ansible.builtin.command:  containerd config default
  register: containerd_config
  changed_when: false

- name: Write containerd config to /etc/containerd/config.toml
  ansible.builtin.copy:
    content: "{{ containerd_config.stdout }}"
    dest: /etc/containerd/config.toml
    owner: root
    group: root
    mode: '0644'

- name: Update SystemdCgroup to true in containerd config
  ansible.builtin.replace:
    path: /etc/containerd/config.toml
    regexp: 'SystemdCgroup = false'
    replace: 'SystemdCgroup = true'
  
- name: Restart containerd
  ansible.builtin.systemd_service:
    name: containerd
    state: restarted

# ----------------------- Auto-Complete

- name: Auto Complete kube
  ansible.builtin.dnf:
    name: bash-completion
    state: present

- name: Add kubectl completion script to .bashrc
  ansible.builtin.lineinfile:
    path: /root/.bashrc
    line: 'source <(kubectl completion bash)'

- name: Apply changes to .bashrc
  ansible.builtin.shell: 'source /root/.bashrc'
  args:
    executable: /bin/bash
  changed_when: false

# ----------------------- reload Daemon
- name: Reload Daemon
  ansible.builtin.systemd_service:
    daemon_reload: true

- name: Ensure python3-pip is installed
  ansible.builtin.package:
    name: python3-pip
    state: present

- name: Install kubernetes python library
  ansible.builtin.pip:
    name: kubernetes
    state: present

- name: Disable firewalld
  ansible.builtin.systemd:
    name: firewalld
    enabled: false
    state: stopped


